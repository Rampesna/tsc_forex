apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: tsc-forex
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          args:
            - postgres
            - -c
            - max_connections=160
            - -c
            - shared_buffers=512MB
            - -c
            - effective_cache_size=3GB
            - -c
            - work_mem=4MB
            - -c
            - maintenance_work_mem=256MB
            - -c
            - autovacuum_work_mem=128MB
            - -c
            - checkpoint_completion_target=0.9
            - -c
            - max_wal_size=2GB
            - -c
            - min_wal_size=256MB
            - -c
            - wal_compression=on
            - -c
            - track_io_timing=on
            - -c
            - idle_in_transaction_session_timeout=60s
            - -c
            - log_min_duration_statement=1000
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: tsc_forex
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: tsc-forex-secrets
                  key: APP_DATABASE_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tsc-forex-secrets
                  key: APP_DATABASE_PASSWORD
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "tsc_forex"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: tsc-forex
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
