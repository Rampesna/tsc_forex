apiVersion: v1
kind: ConfigMap
metadata:
  name: tsc-forex-config
  namespace: tsc-forex
data:
  APP_APP_ENVIRONMENT: "production"
  APP_SERVER_MODE: "release"
  APP_SERVER_PORT: "8080"
  APP_DATABASE_HOST: "postgres"
  APP_DATABASE_PORT: "5432"
  APP_DATABASE_NAME: "tsc_forex"
  APP_DATABASE_SSL_MODE: "disable"
  APP_REDIS_ADDR: "redis:6379"
  APP_REDIS_PUBSUB_CHANNEL: "gold:gram:updates"
  # Real-time market data via Yahoo Finance (no API key; reachable where
  # Binance is blocked). rest+synthetic are always-on fallbacks.
  APP_PROVIDER_PRIMARY: "yahoo"
  APP_PROVIDER_FALLBACKS: "rest,synthetic"
  APP_PROVIDER_REST_ENABLED: "true"
  APP_PROVIDER_REST_POLL_INTERVAL: "2s"
  APP_PROVIDER_REST_FX_BASE_URL: "https://open.er-api.com/v6/latest/USD"
  APP_PROVIDER_REST_GOLD_URL: "https://api.gold-api.com/price/XAU"
  APP_PROVIDER_SYNTHETIC_TICK_INTERVAL: "5s"
  # Object storage (MinIO) for profile pictures — shared across all pods.
  APP_STORAGE_ENDPOINT: "minio:9000"
  APP_STORAGE_BUCKET: "avatars"
  APP_STORAGE_USE_SSL: "false"
  APP_STORAGE_PUBLIC_BASE_URL: "https://tsc-cdn.talhacan.com"
  # Social login: accepted Google ID-token audiences (public client IDs).
  APP_OAUTH_GOOGLE_CLIENT_IDS: "83380535128-16nfuuc3p0jok4l4htitlubgpsjah622.apps.googleusercontent.com,83380535128-pr4lcmaerra3sdqf8211t1nc4n4pbksj.apps.googleusercontent.com"
  APP_OAUTH_APPLE_BUNDLE_IDS: "talhacan.tscforex"
  APP_LOG_ENCODING: "json"
  APP_LOG_LEVEL: "info"
  APP_METRICS_ENABLED: "true"
  APP_NOTIFY_ALERT_COOLDOWN: "60s"
---
apiVersion: v1
kind: Secret
metadata:
  name: tsc-forex-secrets
  namespace: tsc-forex
type: Opaque
stringData:
  # PLACEHOLDERS ONLY — real values are injected at deploy time by the CI/CD
  # pipeline (kubectl create secret ... from GitHub Actions secrets) or applied
  # manually. Never commit real secrets to git.
  APP_DATABASE_USER: "tsc_forex"
  APP_DATABASE_PASSWORD: "REPLACED_BY_CI"
  APP_JWT_SECRET: "REPLACED_BY_CI"
  APP_REDIS_PASSWORD: "REPLACED_BY_CI"
  APP_STORAGE_ACCESS_KEY: "REPLACED_BY_CI"
  APP_STORAGE_SECRET_KEY: "REPLACED_BY_CI"
