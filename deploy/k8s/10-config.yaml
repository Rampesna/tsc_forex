apiVersion: v1
kind: ConfigMap
metadata:
  name: tsc-forex-config
  namespace: tsc-forex
data:
  APP_APP_ENVIRONMENT: "production"
  APP_SERVER_MODE: "release"
  APP_SERVER_PORT: "8080"
  APP_SERVER_WRITE_TIMEOUT: "70s"
  APP_DATABASE_HOST: "postgres"
  APP_DATABASE_PORT: "5432"
  APP_DATABASE_NAME: "tsc_forex"
  APP_DATABASE_SSL_MODE: "disable"
  APP_REDIS_ADDR: "redis:6379"
  APP_REDIS_PUBSUB_CHANNEL: "gold:gram:updates"
  # Real-time market data via Yahoo Finance with real external REST feeds as
  # the only production fallback. Synthetic prices are reserved for local/CI.
  APP_PROVIDER_PRIMARY: "yahoo"
  APP_PROVIDER_FALLBACKS: "rest"
  APP_PROVIDER_REST_ENABLED: "true"
  APP_PROVIDER_REST_POLL_INTERVAL: "2s"
  APP_PROVIDER_REST_FX_BASE_URL: "https://open.er-api.com/v6/latest/USD"
  APP_PROVIDER_REST_GOLD_URL: "https://api.gold-api.com/price/XAU"
  # Crypto priced from Binance (deepest/most real-time), converted to TRY via
  # the live USD/TRY leg. Public market data needs no API key.
  APP_PROVIDER_REST_CRYPTO_BASE_URL: "https://api.binance.com/api/v3/ticker/price"
  # AI market commentary. The API key is injected through tsc-forex-secrets;
  # client applications never receive it.
  APP_AI_ENABLED: "true"
  APP_AI_MODEL: "gpt-5.6-sol"
  APP_AI_BASE_URL: "https://api.openai.com/v1"
  APP_AI_TIMEOUT: "55s"
  APP_AI_MAX_OUTPUT_TOKENS: "8000"
  APP_AI_REASONING_EFFORT: "high"
  APP_AI_WEB_SEARCH: "true"
  APP_AI_SEARCH_CONTEXT: "high"
  APP_AI_MAX_TOOL_CALLS: "6"

  # StoreKit 2 subscriptions. App Review/TestFlight use Sandbox-signed JWS.
  APP_BILLING_ENABLED: "true"
  APP_BILLING_BUNDLE_ID: "talhacan.tscforex"
  APP_BILLING_ALLOW_SANDBOX: "true"
  APP_BILLING_SANDBOX_MAX_LIFETIME: "24h"
  # Production free-trial issuance fails closed unless this is true and a
  # Release/App Store assertion for the submitted bundle version verifies.
  APP_BILLING_APP_ATTEST_ENABLED: "true"
  APP_BILLING_APP_ATTEST_TEAM_ID: "SGQ86WW4J3"
  APP_BILLING_APP_ATTEST_ENVIRONMENT: "production"
  APP_BILLING_APP_ATTEST_BUNDLE_VERSIONS: "3,4,5,6"
  APP_BILLING_APP_ATTEST_CHALLENGE_TTL: "5m"
  # DeviceCheck bit 0 is the reinstall-resistant physical-device redemption
  # marker. Submission remains fail-closed until a DeviceCheck-enabled key is
  # mounted and this Key ID is populated.
  APP_BILLING_DEVICE_CHECK_ENABLED: "true"
  APP_BILLING_DEVICE_CHECK_KEY_ID: ""
  APP_BILLING_DEVICE_CHECK_PRIVATE_KEY_PATH: "/etc/apple-auth/devicecheck.p8"
  # Google Play Billing. Mount the service-account JSON and set the path to enable
  # POST /me/billing/google/sync. Until then Apple billing is unaffected.
  APP_BILLING_GOOGLE_PACKAGE_NAME: "com.talhacan.tscforex"
  APP_BILLING_GOOGLE_CREDENTIALS_PATH: "/etc/google-play/play-billing.json"
  # Object storage (MinIO) for profile pictures — shared across all pods.
  APP_STORAGE_ENABLED: "true"
  APP_STORAGE_ENDPOINT: "minio:9000"
  APP_STORAGE_BUCKET: "avatars"
  APP_STORAGE_USE_SSL: "false"
  APP_STORAGE_PUBLIC_BASE_URL: "https://tsc-cdn.talhacan.com"
  # Social login: accepted Google ID-token audiences (public client IDs).
  APP_OAUTH_GOOGLE_CLIENT_IDS: "83380535128-16nfuuc3p0jok4l4htitlubgpsjah622.apps.googleusercontent.com,83380535128-pr4lcmaerra3sdqf8211t1nc4n4pbksj.apps.googleusercontent.com,83380535128-o4h4v9rc9u1tuis9hggcckqei0idahg3.apps.googleusercontent.com,986533998041-ln1jog6861sleiii0ajcsq4bt48ruin1.apps.googleusercontent.com"
  # iOS app bundle id + Apple Services ID (web Sign in with Apple).
  APP_OAUTH_APPLE_BUNDLE_IDS: "talhacan.tscforex,tscforex"
  # Apple Team ID for AASA (Sign in with Apple + passkeys).
  APP_OAUTH_APPLE_TEAM_ID: "SGQ86WW4J3"
  APP_OAUTH_APPLE_REVOKE_CLIENT_ID: "talhacan.tscforex"
  # Fill with a Sign in with Apple-enabled key ID before App Store submission.
  APP_OAUTH_APPLE_KEY_ID: ""
  APP_OAUTH_APPLE_PRIVATE_KEY_PATH: "/etc/apple-auth/sign-in-with-apple.p8"
  APP_OAUTH_ANDROID_PACKAGE_NAME: "com.talhacan.tscforex"
  APP_OAUTH_ANDROID_SHA256: "0A:AB:C2:DD:D5:A9:70:55:0A:8C:45:E9:A6:5B:82:29:91:28:0B:04:AD:34:3A:BE:FF:0E:1D:CB:F8:31:62:38,AE:7C:A1:5C:06:57:50:8D:DC:0E:2F:11:7D:DE:3A:4D:78:83:B1:32:8A:80:E4:AE:BA:A6:A7:EF:5D:00:F8:16"
  # Sign in with Apple (web) domain verification. Paste the verbatim content of
  # the file Apple issues on the Services ID (tscforex) config
  # screen; it is then served at
  # https://tsc.talhacan.com/.well-known/apple-developer-domain-association.txt
  APP_OAUTH_APPLE_DOMAIN_ASSOCIATION: ""
  # Passkey (WebAuthn) usernameless login. RP ID = the web domain that hosts the
  # login UI (tsc.talhacan.com). The web nginx proxies /.well-known/* to this
  # backend, so the AASA/assetlinks that the native apps fetch from
  # https://tsc.talhacan.com are the same ones this service serves — one RP ID
  # works for web + iOS + Android. RP ID MUST be a registrable suffix of every
  # client origin, which is why the API subdomain cannot be used for the web UI.
  APP_WEBAUTHN_ENABLED: "true"
  APP_WEBAUTHN_RP_DISPLAY_NAME: "TSC Forex"
  APP_WEBAUTHN_RP_ID: "tsc.talhacan.com"
  APP_WEBAUTHN_RP_ORIGINS: "https://tsc.talhacan.com"
  APP_LOG_ENCODING: "json"
  APP_LOG_LEVEL: "info"
  APP_METRICS_ENABLED: "true"
  APP_NOTIFY_ALERT_COOLDOWN: "60s"
  # Push notifications. Credential files are mounted at /etc/push from the
  # tsc-forex-push secret (created out-of-band, see 40-app.yaml).
  APP_NOTIFY_APNS_ENABLED: "true"
  APP_NOTIFY_APNS_TOPIC: "talhacan.tscforex"
  APP_NOTIFY_APNS_KEY_ID: "2729F227T3"
  APP_NOTIFY_APNS_TEAM_ID: "SGQ86WW4J3"
  APP_NOTIFY_APNS_KEY_PATH: "/etc/push/apns.p8"
  # Production APNs is required for TestFlight/App Store device tokens.
  # Local development keeps notify.apns_sandbox=true in configs/config.yaml.
  APP_NOTIFY_APNS_SANDBOX: "false"
  APP_NOTIFY_FCM_ENABLED: "true"
  APP_NOTIFY_FCM_PROJECT_ID: "tscforex-16f7e"
  APP_NOTIFY_FCM_CREDENTIAL_PATH: "/etc/push/fcm.json"
  # Private operations console. The bootstrap password is injected from the
  # tsc-forex-secrets Secret and is only consumed if this account does not yet
  # exist. It is never stored in this ConfigMap or a container image.
  APP_ADMIN_ENABLED: "true"
  APP_ADMIN_BOOTSTRAP_EMAIL: "talha@talhacan.com"
  APP_ADMIN_ALLOWED_ORIGIN: "https://tscfm.talhacan.com"
  APP_ADMIN_COOKIE_SECURE: "true"
  APP_ADMIN_MAX_RECIPIENTS: "100000"
  APP_ADMIN_CAMPAIGN_BATCH_SIZE: "100"
  APP_ADMIN_SEND_PER_SECOND: "20"
  APP_ADMIN_PRESENCE_TTL: "90s"
# NOTE: the Secret "tsc-forex-secrets" is intentionally NOT defined here so it is
# never committed to git and never clobbered by `kubectl apply -k`. It is created
# out-of-band from real values (CI/CD from GitHub Actions secrets, or manually):
#   kubectl -n tsc-forex create secret generic tsc-forex-secrets \
#     --from-literal=APP_DATABASE_USER=... --from-literal=APP_DATABASE_PASSWORD=... \
#     --from-literal=APP_JWT_SECRET=... --from-literal=APP_REDIS_PASSWORD=... \
#     --from-literal=APP_STORAGE_ACCESS_KEY=... --from-literal=APP_STORAGE_SECRET_KEY=... \
#     --from-literal=APP_AI_API_KEY=... --from-literal=APP_ADMIN_BOOTSTRAP_PASSWORD=...
