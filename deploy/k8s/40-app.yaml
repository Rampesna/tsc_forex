apiVersion: apps/v1
kind: Deployment
metadata:
  name: tsc-forex-app
  namespace: tsc-forex
  labels:
    app: tsc-forex-app
spec:
  replicas: 3
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Capacity never drops during a release; one replacement is proven ready
      # before an old pod receives SIGTERM.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: tsc-forex-app
  template:
    metadata:
      labels:
        app: tsc-forex-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      # Budget: preStop 5s + app traffic drain 5s + graceful HTTP/WS 75s +
      # background persistence cleanup 10s + 15s safety reserve.
      terminationGracePeriodSeconds: 110
      containers:
        - name: app
          image: tsc-forex:latest   # push to your registry and update
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: tsc-forex-config
            - secretRef:
                name: tsc-forex-secrets
          lifecycle:
            preStop:
              exec:
                # Kubernetes marks the EndpointSlice terminating/ready=false in
                # parallel; this gives proxies and external LBs time to converge
                # before SIGTERM starts the application's own drain phase.
                command: ["/bin/sh", "-c", "sleep 5"]
          volumeMounts:
            # Push credentials (APNs .p8 + Firebase service account) mounted
            # read-only from the tsc-forex-push secret, created out-of-band:
            #   kubectl -n tsc-forex create secret generic tsc-forex-push \
            #     --from-file=apns.p8=AuthKey_XXX.p8 \
            #     --from-file=fcm.json=firebase-adminsdk.json
            - name: push-creds
              mountPath: /etc/push
              readOnly: true
            # Dedicated Apple private keys: sign-in-with-apple.p8 revokes login
            # tokens before deletion; devicecheck.p8 authorizes DeviceCheck's
            # reinstall-resistant free-trial bit. Create both out of band.
            - name: apple-auth-creds
              mountPath: /etc/apple-auth
              readOnly: true
            # Google Play Developer API service-account JSON for subscription
            # verification (POST /me/billing/google/sync). Create out-of-band:
            #   kubectl -n tsc-forex create secret generic tsc-forex-google-play \
            #     --from-file=play-billing.json=/path/to/play-billing.json
            # Optional until credentials exist — Apple billing stays unaffected.
            - name: google-play-creds
              mountPath: /etc/google-play
              readOnly: true
          # Startup can be slow after a cold DB (the day-open baseline seed
          # scans a large price_ticks window before the HTTP server binds).
          # startupProbe disables liveness/readiness until the app is up so a
          # slow boot never triggers a crash loop.
          startupProbe:
            httpGet:
              path: /livez
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 1
          resources:
            requests:
              cpu: "200m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
      volumes:
        - name: push-creds
          secret:
            secretName: tsc-forex-push
            optional: true
        - name: apple-auth-creds
          secret:
            secretName: tsc-forex-apple-auth
            optional: true
        - name: google-play-creds
          secret:
            secretName: tsc-forex-google-play
            optional: true
      # Rolling updates keep the WebSocket stream broadcasting during deploys.
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tsc-forex-app
  namespace: tsc-forex
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: tsc-forex-app
---
apiVersion: v1
kind: Service
metadata:
  name: tsc-forex-app
  namespace: tsc-forex
  annotations:
    # aaPanel reverse proxy (proxy project) forwards tsc-api.talhacan.com →
    # http://127.0.0.1:4700. The nodePort is pinned inside the 4700-4900 range
    # requested so it never collides with other projects on the host.
    # NOTE: the cluster's node-port range must include 4700-4900, e.g. k3s:
    #   --service-node-port-range=4700-4900
    tsc-forex/proxy-target: "127.0.0.1:4700"
spec:
  selector:
    app: tsc-forex-app
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 4700
  type: NodePort
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tsc-forex-app
  namespace: tsc-forex
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tsc-forex-app
  # Baseline headroom of 5 pods absorbs connection storms (deploys / mass
  # reconnects) before CPU-driven autoscaling reacts; verified holding 10k
  # concurrent WebSocket clients with zero drops when adequately scaled.
  minReplicas: 5
  maxReplicas: 24
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      # React fast to load spikes: allow doubling every 15s.
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      # Scale down conservatively to avoid dropping connections on dips.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
