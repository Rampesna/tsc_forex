apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: tsc-forex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # requirepass matches APP_REDIS_PASSWORD so the app can AUTH. k8s
          # expands $(VAR) from the container env below.
          args: ["redis-server", "--appendonly", "yes", "--requirepass", "$(APP_REDIS_PASSWORD)"]
          env:
            - name: APP_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tsc-forex-secrets
                  key: APP_REDIS_PASSWORD
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$APP_REDIS_PASSWORD\" ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: tsc-forex
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
