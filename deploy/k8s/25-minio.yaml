# MinIO — S3-compatible object storage for profile pictures. Runs as a shared
# service so every app pod reads/writes the same avatar bucket (no "image shows
# on one pod but not another" problem). Exposed to aaPanel via NodePorts:
#   - 4710 → S3 API   (cdn.talhacan.com serves the public "avatars" bucket)
#   - 4711 → Console  (minio.talhacan.com, admin only)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: tsc-forex
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-04-08T15-41-24Z
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: tsc-forex-secrets
                  key: APP_STORAGE_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tsc-forex-secrets
                  key: APP_STORAGE_SECRET_KEY
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: minio-data
              mountPath: /data
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
  volumeClaimTemplates:
    - metadata:
        name: minio-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
# In-cluster access for the app pods (minio:9000).
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: tsc-forex
spec:
  selector:
    app: minio
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
  clusterIP: None
---
# Host-reachable NodePorts for aaPanel reverse proxy (4700-4900 range).
apiVersion: v1
kind: Service
metadata:
  name: minio-external
  namespace: tsc-forex
  annotations:
    tsc-forex/proxy-target-s3: "127.0.0.1:4710"   # cdn.talhacan.com
    tsc-forex/proxy-target-console: "127.0.0.1:4711"  # minio.talhacan.com
spec:
  type: NodePort
  selector:
    app: minio
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
      nodePort: 4710
    - name: console
      port: 9001
      targetPort: 9001
      nodePort: 4711
