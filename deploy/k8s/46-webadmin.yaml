apiVersion: apps/v1
kind: Deployment
metadata:
  name: tsc-forex-webadmin
  namespace: tsc-forex
  labels:
    app: tsc-forex-webadmin
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: tsc-forex-webadmin
  template:
    metadata:
      labels:
        app: tsc-forex-webadmin
    spec:
      containers:
        - name: webadmin
          image: ghcr.io/rampesna/tsc_forex-webadmin:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: nginx-tmp
              mountPath: /tmp
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: nginx-tmp
          emptyDir:
            sizeLimit: "16Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: tsc-forex-webadmin
  namespace: tsc-forex
  annotations:
    # aaPanel reverse proxy forwards tscfm.talhacan.com to this host port.
    tsc-forex/proxy-target: "127.0.0.1:4775"
spec:
  selector:
    app: tsc-forex-webadmin
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 4775
  type: NodePort
