worker_processes auto;

events {
    worker_connections 10240;
}

http {
    upstream tsc_forex_backend {
        least_conn;
        server app:8080 max_fails=3 fail_timeout=10s;
        # docker-compose scales "app"; DNS round-robin resolves replicas.
        keepalive 64;
    }

    # WebSocket upgrade mapping.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    log_format json_combined escape=json
      '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
      '"request":"$request","status":$status,'
      '"request_time":$request_time,"upstream":"$upstream_addr"}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Basic rate limiting zone (defense-in-depth; app also rate-limits).
    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;

    server {
        listen 8080;
        server_name _;

        # WebSocket endpoint — long-lived, no buffering, extended timeouts.
        location /ws {
            proxy_pass http://tsc_forex_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # REST API.
        location /api/ {
            limit_req zone=api burst=100 nodelay;
            proxy_pass http://tsc_forex_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 70s;
        }

        location /docs {
            proxy_pass http://tsc_forex_backend;
            proxy_set_header Host $host;
        }

        # Metrics should not be public in production; restrict as needed.
        location /metrics {
            proxy_pass http://tsc_forex_backend;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            deny all;
        }
    }
}
