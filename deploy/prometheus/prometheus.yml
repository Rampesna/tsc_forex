global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: tsc_forex
    metrics_path: /metrics
    dns_sd_configs:
      - names:
          - app
        type: A
        port: 8080
    # Fallback static target for single-instance runs.
    static_configs:
      - targets: ["app:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
