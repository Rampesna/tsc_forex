app:
  name: tsc_forex
  environment: development

server:
  host: "0.0.0.0"
  port: 8080
  read_timeout: 10s
  write_timeout: 70s
  shutdown_timeout: 15s
  mode: debug

database:
  host: localhost
  port: 5432
  user: tsc_forex
  password: tsc_forex
  name: tsc_forex
  ssl_mode: disable
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 30m
  conn_max_idle_time: 5m

redis:
  addr: localhost:6379
  password: ""
  db: 0
  pool_size: 20
  min_idle_conns: 5
  dial_timeout: 3s
  read_timeout: 2s
  write_timeout: 2s
  pubsub_channel: gold:gram:updates

nats:
  enabled: false
  url: nats://localhost:4222
  subject: gold.gram.updates

provider:
  # yahoo: REAL-TIME market data (no API key) via Yahoo Finance chart API.
  # Polls GC=F (gold USD/oz), USDTRY=X, EURTRY=X, GBPTRY=X, JPYTRY=X every 2s.
  # Yahoo quotes TRY pairs directly, so no cross-rate math is needed. Reachable
  # from networks where Binance is blocked/reset. rest (er-api+gold-api) and
  # synthetic are fallbacks so the stream never stops.
  primary: yahoo
  fallbacks: [rest, synthetic]
  reconnect_initial: 1s
  reconnect_max: 30s
  health_interval: 5s
  stale_threshold: 30s
  mock:
    enabled: true
    tick_interval: 500ms
    xauusd_base: 4060.0
    usdtry_base: 47.0
    jitter_percent: 0.05
  synthetic:
    enabled: true
    tick_interval: 5s          # backend fetches/updates every 5 seconds
    xauusd_base: 4060.0
    usdtry_base: 47.0
    eurtry_base: 53.6
    gbptry_base: 63.0
    jpytry_base: 0.29
    jitter_percent: 0.03
  rest:
    enabled: true
    poll_interval: 2s          # also controls the binance provider poll cadence
    fx_base_url: "https://open.er-api.com/v6/latest/USD"
    gold_url: "https://api.gold-api.com/price/XAU"   # XAU USD/oz, returns {"price": <usd>}
    # Crypto: Binance batch price endpoint (deepest/most real-time source).
    # Symbols are <SYM>USDT, converted to TRY via the live USD/TRY leg.
    crypto_base_url: "https://api.binance.com/api/v3/ticker/price"
    timeout: 4s
  twelvedata:
    enabled: false
    api_key: ""
    ws_url: "wss://ws.twelvedata.com/v1/quotes/price"
    rest_url: "https://api.twelvedata.com"
    symbols: ["XAU/USD", "USD/TRY"]
  finnhub:
    enabled: false
    api_key: ""
    ws_url: "wss://ws.finnhub.io"
    rest_url: "https://finnhub.io/api/v1"
    symbols: ["OANDA:XAU_USD", "OANDA:USD_TRY"]
  polygon:
    enabled: false
    api_key: ""
    ws_url: "wss://socket.polygon.io/forex"
    rest_url: "https://api.polygon.io"
    symbols: ["C:XAUUSD", "C:USDTRY"]
  alphavantage:
    enabled: false
    api_key: ""
    ws_url: ""
    rest_url: "https://www.alphavantage.co/query"
    symbols: ["XAUUSD", "USDTRY"]

jwt:
  secret: "CHANGE_ME_TO_A_LONG_RANDOM_SECRET_KEY_32+"
  issuer: tsc_forex
  access_token_ttl: 15m
  refresh_token_ttl: 168h

websocket:
  path: /ws
  write_wait: 10s
  pong_wait: 60s
  ping_period: 54s
  max_message_size: 4096
  # Per-client outbound queue. Larger buffer absorbs broadcast bursts at 10k+
  # fan-out so transient write slowness drops messages later, not connections.
  send_buffer_size: 512
  enable_compression: true
  check_origin: false

cache:
  latest_price_ttl: 60s
  latest_price_key: gold:gram:latest

gold:
  troy_ounce_to_gram: 31.1034768
  persist_every: true
  history_workers: 4
  history_queue_size: 4096

metrics:
  enabled: true
  path: /metrics

tracing:
  enabled: false
  endpoint: localhost:4317
  service_name: tsc_forex
  sample_rate: 0.1

cors:
  allowed_origins: ["*"]
  allowed_methods: ["GET", "POST", "PATCH", "PUT", "DELETE", "OPTIONS"]
  allowed_headers: ["Authorization", "Content-Type", "X-Request-ID"]
  allow_credentials: false
  max_age: 86400

notify:
  alert_cooldown: 60s
  apns_enabled: false
  apns_topic: talhacan.tscforex   # iOS bundle id
  apns_key_id: ""
  apns_team_id: ""
  apns_key_path: ""
  apns_sandbox: true
  # Android push via Firebase Cloud Messaging (HTTP v1). Set via
  # APP_NOTIFY_FCM_* env; credential file mounted at /etc/push/fcm.json in k8s.
  fcm_enabled: false
  fcm_project_id: ""
  fcm_credential_path: ""

# Social login. These are public OAuth client IDs (not secrets); they are the
# accepted "aud" values when verifying Google ID tokens from the mobile apps.
oauth:
  google_client_ids:
    - 83380535128-16nfuuc3p0jok4l4htitlubgpsjah622.apps.googleusercontent.com   # iOS
    - 83380535128-pr4lcmaerra3sdqf8211t1nc4n4pbksj.apps.googleusercontent.com   # Android (installed)
    - 83380535128-o4h4v9rc9u1tuis9hggcckqei0idahg3.apps.googleusercontent.com   # Web (Android Credential Manager serverClientId)
    - 986533998041-ln1jog6861sleiii0ajcsq4bt48ruin1.apps.googleusercontent.com  # Web (tscforex-16f7e, JS origin tsc.talhacan.com)
  apple_bundle_ids:
    - talhacan.tscforex            # iOS app bundle id (native Sign in with Apple)
    - tscforex                     # Apple Services ID (web Sign in with Apple)
  # Apple Developer Team ID — used to build the AASA webcredentials for passkeys
  # + Sign in with Apple. Overridable via APP_OAUTH_APPLE_TEAM_ID.
  apple_team_id: SGQ86WW4J3
  # Required before App Store submission so in-app deletion can revoke Sign in
  # with Apple. Mount the .p8 key as a secret; never paste it into this file.
  apple_revoke_client_id: talhacan.tscforex
  apple_key_id: ""
  apple_private_key_path: ""
  android_package_name: com.talhacan.tscforex
  # Debug/local release and Google Play App Signing SHA-256 fingerprints.
  android_sha256:
    - "0A:AB:C2:DD:D5:A9:70:55:0A:8C:45:E9:A6:5B:82:29:91:28:0B:04:AD:34:3A:BE:FF:0E:1D:CB:F8:31:62:38"
    - "AE:7C:A1:5C:06:57:50:8D:DC:0E:2F:11:7D:DE:3A:4D:78:83:B1:32:8A:80:E4:AE:BA:A6:A7:EF:5D:00:F8:16"
  # Sign in with Apple (web) domain verification file content (from the Services
  # ID config screen). Served at
  # /.well-known/apple-developer-domain-association.txt. Set via
  # APP_OAUTH_APPLE_DOMAIN_ASSOCIATION in production.
  apple_domain_association: ""

# Passkey (WebAuthn) — usernameless login. RP ID = the web login domain
# (tsc.talhacan.com). The web nginx proxies /.well-known/* to this backend, so
# the AASA/assetlinks that the native apps fetch from https://tsc.talhacan.com
# are served here too — a single RP ID works for web + iOS + Android. The RP ID
# must be a registrable suffix of every client origin.
webauthn:
  enabled: true
  rp_display_name: TSC Forex
  rp_id: tsc.talhacan.com
  rp_origins:
    - https://tsc.talhacan.com

rate_limit:
  enabled: true
  requests: 100
  window_sec: 60

# Optional AI-assisted market research. Keep the key in APP_AI_API_KEY; never put it in
# this file or in a browser/mobile build.
ai:
  enabled: false
  api_key: ""
  model: gpt-5.6-sol
  base_url: https://api.openai.com/v1
  timeout: 55s
  max_output_tokens: 8000
  reasoning_effort: high
  web_search: true
  search_context: high
  max_tool_calls: 6

# iOS auto-renewable subscriptions. StoreKit transactions are accepted only
# after Apple JWS verification and exact bundle/product matching.
billing:
  enabled: false
  bundle_id: talhacan.tscforex
  allow_sandbox: true
  sandbox_max_lifetime: 24h
  # Enable only after the iOS target includes the App Attest entitlement and
  # its challenge/register/assertion integration has been verified.
  app_attest_enabled: false
  app_attest_team_id: SGQ86WW4J3
  app_attest_environment: development
  app_attest_root_ca_path: ""
  app_attest_bundle_versions: ["3", "4"]
  app_attest_challenge_ttl: 5m
  device_check_enabled: false
  device_check_key_id: ""
  device_check_private_key_path: ""
  # Google Play Billing (Android). Leave credentials empty until a Play Console
  # service account JSON is mounted; Apple StoreKit continues to work alone.
  google_package_name: com.talhacan.tscforex
  google_credentials_path: ""

log:
  level: info
  encoding: json
  development: true
