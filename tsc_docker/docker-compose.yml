services:
  postgres:
    # pgvector image = Postgres 16 + the `vector` extension for future AI
    # features (price-pattern similarity, forecasting, anomaly detection).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tsc_forex
      POSTGRES_PASSWORD: tsc_forex
      POSTGRES_DB: tsc_forex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tsc_forex"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: tsc_docker/Dockerfile
      args:
        VERSION: "1.0.0"
    environment:
      APP_APP_ENVIRONMENT: production
      APP_SERVER_MODE: release
      APP_DATABASE_HOST: postgres
      APP_DATABASE_PORT: "5432"
      APP_DATABASE_USER: tsc_forex
      APP_DATABASE_PASSWORD: tsc_forex
      APP_DATABASE_NAME: tsc_forex
      APP_REDIS_ADDR: redis:6379
      APP_PROVIDER_PRIMARY: yahoo
      APP_PROVIDER_REST_ENABLED: "true"
      APP_PROVIDER_REST_POLL_INTERVAL: "2s"
      APP_PROVIDER_REST_FX_BASE_URL: "https://open.er-api.com/v6/latest/USD"
      APP_PROVIDER_REST_GOLD_URL: "https://api.gold-api.com/price/XAU"
      APP_JWT_SECRET: "change_me_to_a_very_long_random_secret_key_32+"
      APP_LOG_ENCODING: json
      APP_LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"
    deploy:
      replicas: 2
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ../deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    depends_on:
      - app
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ../deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ../deploy/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  redisdata:
