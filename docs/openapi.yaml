openapi: 3.0.3
info:
  title: TSC Forex — Gram Gold API
  description: >
    Production-grade backend that calculates and streams live Gram Gold
    (XAU gram TRY) from XAU/USD and USD/TRY feeds.
    Formula: GramGoldTRY = (XAUUSD / 31.1034768) * USDTRY.
  version: "1.0.0"
  license:
    name: MIT
servers:
  - url: /api/v1
    description: API v1
tags:
  - name: gold
  - name: instruments
  - name: user
  - name: portfolio
  - name: system
  - name: auth
paths:
  /gold/current:
    get:
      tags: [gold]
      summary: Current gram gold price
      responses:
        "200":
          description: Latest price
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GoldResponse" }
        "503":
          description: Price not available yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /gold/history:
    get:
      tags: [gold]
      summary: Historical prices or OHLC candles
      parameters:
        - { name: symbol, in: query, schema: { type: string }, description: "Default XAU_GRAM_TRY" }
        - { name: from, in: query, schema: { type: string }, description: "RFC3339 or unix seconds" }
        - { name: to, in: query, schema: { type: string }, description: "RFC3339 or unix seconds" }
        - { name: limit, in: query, schema: { type: integer }, description: "Raw mode row cap" }
        - { name: interval, in: query, schema: { type: string, enum: [1m,5m,15m,30m,1h,4h,1d] }, description: "Aggregate into OHLC" }
      responses:
        "200": { description: History or candles }
        "400":
          description: Invalid interval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503": { description: History storage not configured }
  /providers:
    get:
      tags: [system]
      summary: Provider status and failover chain
      responses:
        "200": { description: Provider statuses }
  /health:
    get:
      tags: [system]
      summary: Service and dependency health
      responses:
        "200": { description: Healthy }
        "503": { description: Degraded }
  /version:
    get:
      tags: [system]
      summary: Build version
      responses:
        "200": { description: Version info }
  /auth/register:
    post:
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201": { description: Created }
        "400": { description: Validation error }
        "409": { description: Email already registered }
  /auth/login:
    post:
      tags: [auth]
      summary: Log in and receive JWT tokens
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401": { description: Invalid credentials }
  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate refresh token
      responses:
        "200": { description: New token pair }
        "401": { description: Invalid or expired refresh token }
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke a refresh token
      responses:
        "200": { description: Logged out }
  /instruments:
    get:
      tags: [instruments]
      summary: Full instrument catalog (all gold products + currencies)
      responses:
        "200": { description: Catalog }
  /instruments/prices:
    get:
      tags: [instruments]
      summary: Live prices for all instruments
      responses:
        "200": { description: Prices }
        "503": { description: Not ready }
  /instruments/{code}:
    get:
      tags: [instruments]
      summary: Latest price for one instrument
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Price }
        "404": { description: Unknown instrument }
  /instruments/{code}/history:
    get:
      tags: [instruments]
      summary: Per-instrument history / OHLC
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
        - { name: interval, in: query, schema: { type: string }, description: "1m,5m,15m,30m,1h,4h,1d" }
        - { name: from, in: query, schema: { type: string } }
        - { name: to, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200": { description: History }
  /me/watchlist:
    get:
      tags: [user]
      summary: List tracked instruments
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Codes } }
    post:
      tags: [user]
      summary: Add instrument to watchlist
      security: [{ bearerAuth: [] }]
      responses: { "201": { description: Added } }
  /me/watchlist/{code}:
    delete:
      tags: [user]
      summary: Remove instrument from watchlist
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Removed } }
  /me/alerts:
    get:
      tags: [user]
      summary: List active one-shot price alerts
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Alerts } }
    post:
      tags: [user]
      summary: Create a one-shot price-threshold alert
      security: [{ bearerAuth: [] }]
      responses: { "201": { description: Created } }
  /me/alerts/{id}:
    patch:
      tags: [user]
      summary: Update the direction and threshold of an active alert
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Updated }
        "404": { description: Alert is missing, owned by another user, or already triggered }
    delete:
      tags: [user]
      summary: Delete an alert
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { "200": { description: Deleted } }
  /me/notifications:
    get:
      tags: [user]
      summary: Notification history
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Notifications } }
  /me/devices:
    post:
      tags: [user]
      summary: Register a push (APNs/FCM) token
      security: [{ bearerAuth: [] }]
      responses: { "201": { description: Registered } }
  /me/portfolios:
    get:
      tags: [portfolio]
      summary: List cloud portfolios with live TRY analytics
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Portfolio overviews }
    post:
      tags: [portfolio]
      summary: Create a portfolio
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortfolioRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Portfolio" }
  /me/portfolios/{portfolioID}:
    parameters:
      - { name: portfolioID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [portfolio]
      summary: Portfolio positions, allocation and P&L
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortfolioOverview" }
    patch:
      tags: [portfolio]
      summary: Rename a portfolio
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortfolioRequest" }
      responses: { "200": { description: Updated } }
    delete:
      tags: [portfolio]
      summary: Delete a portfolio and its complete ledger
      security: [{ bearerAuth: [] }]
      responses: { "204": { description: Deleted } }
  /me/portfolios/{portfolioID}/positions/{code}:
    get:
      tags: [portfolio]
      summary: Position analytics and transaction history
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: portfolioID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: code, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Position detail } }
  /me/portfolios/{portfolioID}/transactions:
    parameters:
      - { name: portfolioID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [portfolio]
      summary: Paginated transaction ledger
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, maximum: 500 } }
        - { name: before, in: query, schema: { type: string, format: date-time } }
      responses: { "200": { description: Transactions } }
    post:
      tags: [portfolio]
      summary: Add an idempotent ledger transaction
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortfolioTransactionRequest" }
      responses:
        "201": { description: Created }
        "200": { description: Existing transaction returned for duplicate client_id }
        "409": { description: Transaction would make a position negative }
  /me/portfolios/{portfolioID}/transactions/{transactionID}:
    parameters:
      - { name: portfolioID, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: transactionID, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [portfolio]
      summary: Edit and atomically re-project the ledger
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortfolioTransactionRequest" }
      responses: { "200": { description: Updated }, "409": { description: Negative position } }
    delete:
      tags: [portfolio]
      summary: Delete and atomically re-project the ledger
      security: [{ bearerAuth: [] }]
      responses: { "204": { description: Deleted }, "409": { description: Negative position } }
  /me/portfolios/{portfolioID}/performance:
    get:
      tags: [portfolio]
      summary: Cash-flow-aware daily portfolio performance from indexed candles
      description: >-
        Replays the user's transaction ledger for each UTC day and values every
        open position from the same indexed 1d candle history used by instrument
        charts. USD-quoted holdings are converted with that day's USDTRY close;
        weekends and market holidays carry the most recent known close forward.
        Dates before the first available close remain zero instead of using a
        fabricated price. The server caps history at five years and downsamples
        chronologically when `points` is exceeded. Clients should keep the last
        successful series for the same portfolio when a refresh is unavailable,
        but must never reuse it for a different portfolio.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: portfolioID, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: range, in: query, schema: { type: string, enum: [1m, 3m, 6m, 1y, 5y, max] } }
        - { name: points, in: query, schema: { type: integer, maximum: 2000 } }
      responses: { "200": { description: Daily performance points } }
  /me/gamification:
    get:
      tags: [gamification]
      summary: XP, streak, badge and daily quest projection
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Gamification profile } }
  /me/gamification/checkin:
    post:
      tags: [gamification]
      summary: Legacy idempotent daily check-in
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Current profile and awarded XP } }
  /me/gamification/leaderboard:
    get:
      tags: [gamification]
      summary: Legacy weekly XP leaderboard
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Weekly leaderboard } }
  /me/gamification/experience:
    get:
      tags: [gamification]
      summary: Versioned learning, discipline, season, paper and privacy dashboard
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Complete cross-platform experience snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GamificationExperience" }
  /me/gamification/daily-plan:
    post:
      tags: [gamification]
      summary: Save today's risk and learning plan and advance the streak idempotently
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DailyPlanRequest" }
      responses: { "200": { description: Updated profile and award result } }
  /me/gamification/quiz-attempts:
    post:
      tags: [gamification]
      summary: Record an idempotent mastery or spaced-repetition attempt
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuizAttemptRequest" }
      responses: { "200": { description: Correctness, mastery and XP result } }
  /me/gamification/discipline/{code}:
    post:
      tags: [gamification]
      summary: Complete a process-based portfolio discipline review
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, minLength: 20, maxLength: 1000 }
      responses: { "200": { description: Idempotent award result } }
  /me/gamification/season:
    get:
      tags: [gamification]
      summary: Current process-scored season, league and privacy-filtered standings
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Current season } }
  /me/gamification/paper-trades:
    post:
      tags: [gamification]
      summary: Lock a paper decision with thesis, risk and invalidation criteria
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaperTradeRequest" }
      responses:
        "201": { description: Created }
        "200": { description: Existing trade returned for duplicate client_id }
  /me/gamification/paper-trades/{tradeID}/review:
    patch:
      tags: [gamification]
      summary: Score a paper decision process without using financial return
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: tradeID, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [followed_plan, retrospective]
              properties:
                followed_plan: { type: boolean }
                retrospective: { type: string, minLength: 20, maxLength: 1000 }
      responses: { "200": { description: Reviewed trade and XP result } }
  /me/gamification/privacy:
    patch:
      tags: [gamification]
      summary: Update alias, league, personalization, social and notification consent
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Saved privacy preferences } }
  /me/gamification/study-groups:
    post:
      tags: [gamification]
      summary: Create a privacy-safe 3–8 person learning group
      security: [{ bearerAuth: [] }]
      responses: { "201": { description: Group and invite code } }
  /me/gamification/study-groups/join:
    post:
      tags: [gamification]
      summary: Join a privacy-safe learning group by invite code
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: Joined }, "409": { description: Group full } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    GoldResponse:
      type: object
      properties:
        symbol: { type: string }
        price: { type: number }
        mid_price: { type: number }
        spread: { type: number }
        xauusd: { type: number }
        usdtry: { type: number }
        provider: { type: string }
        timestamp: { type: string, format: date-time }
        source: { type: string, enum: [calculator, cache] }
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    TokenResponse:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string }
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
    Decimal:
      oneOf:
        - { type: string, pattern: "^-?[0-9]+(\\.[0-9]+)?$" }
        - { type: number }
      description: Exact NUMERIC value; responses serialize it as a decimal string.
    PortfolioRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
    Portfolio:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        base_currency: { type: string, enum: [TRY] }
        net_deposits_try: { $ref: "#/components/schemas/Decimal" }
        version: { type: integer, format: int64 }
    PortfolioPosition:
      type: object
      properties:
        code: { type: string }
        currency: { type: string, enum: [TRY, USD] }
        quantity: { $ref: "#/components/schemas/Decimal" }
        average_cost_native: { $ref: "#/components/schemas/Decimal" }
        average_cost_try: { $ref: "#/components/schemas/Decimal" }
        value_try: { $ref: "#/components/schemas/Decimal" }
        unrealized_pnl_try: { $ref: "#/components/schemas/Decimal" }
        realized_pnl_try: { $ref: "#/components/schemas/Decimal" }
        allocation_pct: { $ref: "#/components/schemas/Decimal" }
    PortfolioOverview:
      type: object
      properties:
        portfolio: { $ref: "#/components/schemas/Portfolio" }
        positions:
          type: array
          items: { $ref: "#/components/schemas/PortfolioPosition" }
        total_value_try: { $ref: "#/components/schemas/Decimal" }
        total_cost_try: { $ref: "#/components/schemas/Decimal" }
        unrealized_pnl_try: { $ref: "#/components/schemas/Decimal" }
        realized_pnl_try: { $ref: "#/components/schemas/Decimal" }
        day_change_try: { $ref: "#/components/schemas/Decimal" }
    PortfolioTransactionRequest:
      type: object
      required: [client_id, type, occurred_at]
      properties:
        client_id: { type: string, maxLength: 80 }
        code: { type: string }
        type: { type: string, enum: [buy, sell, dividend, fee, deposit, withdraw] }
        quantity: { $ref: "#/components/schemas/Decimal" }
        unit_price_native: { $ref: "#/components/schemas/Decimal" }
        amount_native: { $ref: "#/components/schemas/Decimal" }
        fee_native: { $ref: "#/components/schemas/Decimal" }
        currency: { type: string, enum: [TRY, USD] }
        usdtry: { $ref: "#/components/schemas/Decimal" }
        occurred_at: { type: string, format: date-time }
        note: { type: string, maxLength: 500 }
    DailyPlanRequest:
      type: object
      required: [risk_appetite, watch_codes, learning_goal]
      properties:
        risk_appetite: { type: string, enum: [low, moderate, high] }
        watch_codes:
          type: array
          maxItems: 3
          uniqueItems: true
          items: { type: string }
        learning_goal:
          type: string
          enum: [risk_budget, diversification, fees_behavior, macro_calendar, cross_market, source_quality]
        reflection: { type: string, maxLength: 500 }
    QuizAttemptRequest:
      type: object
      required: [lesson_code, question_code, answer, idempotency_key]
      properties:
        lesson_code: { type: string }
        question_code: { type: string }
        answer: { type: integer, minimum: 0 }
        idempotency_key: { type: string, minLength: 8, maxLength: 120 }
    PaperTradeRequest:
      type: object
      required: [client_id, code, side, quantity, entry_price, thesis, risk_budget_pct, invalidation]
      properties:
        client_id: { type: string, minLength: 8, maxLength: 80 }
        code: { type: string }
        side: { type: string, enum: [buy, sell] }
        quantity: { type: number, exclusiveMinimum: 0 }
        entry_price: { type: number, exclusiveMinimum: 0 }
        thesis: { type: string, minLength: 20, maxLength: 1000 }
        risk_budget_pct: { type: number, exclusiveMinimum: 0, maximum: 5 }
        invalidation: { type: string, minLength: 10, maxLength: 500 }
        occurred_at: { type: string, format: date-time }
    GamificationExperience:
      type: object
      required: [rule_version, lessons, discipline_quests, season, paper_trades, privacy, study_groups, weekly_summary]
      properties:
        rule_version: { type: string }
        daily_plan: { type: object, nullable: true }
        lessons: { type: array, items: { type: object } }
        discipline_quests: { type: array, items: { type: object } }
        season: { type: object }
        paper_trades: { type: array, items: { type: object } }
        privacy: { type: object }
        study_groups: { type: array, items: { type: object } }
        weekly_summary: { type: object }
